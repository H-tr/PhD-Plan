<style>
/* Control Panel. Styled after h-tr.github.io: cream paper and black ink in light mode, candle-lit night
   paper in dark mode, Palatino with italics and small caps for hierarchy, hairline rules instead of
   heavy cards. Color tokens mirror css/theme.css of the homepage; the theme choice is shared with it
   through the same localStorage key ("theme"). */
:root{
  --bg:#fffff8; --surface:#fffff8; --sunk:#f4f2e8; --ink:#111; --text:#111; --soft:#333; --muted:#555; --faint:#8a877e;
  --line:#e4e2d8; --line-strong:#bdb9ad; --accent:#2c2c2e; --accent-soft:rgba(17,17,17,.05); --on-accent:#fffff8;
  --hl:#a8281e; --hl-bg:rgba(168,40,30,.08); --warn:#8a5a00; --warn-bg:rgba(176,122,20,.13); --ok:#2f7a57; --ok-bg:rgba(47,122,87,.1);
  --shadow:rgba(17,17,17,.12); --underline:rgba(17,17,17,.35); --selection:rgba(17,17,17,.12); --note:rgba(70,70,70,.72);
  --glow:none; --ind-glow:none; --heat:17,17,17; --heat0:rgba(17,17,17,.055);
  --f-body:et-book,Palatino,"Palatino Linotype","Palatino LT STD","Book Antiqua",Georgia,"Songti SC","Noto Serif SC",serif;
  --f-zh:"LXGW WenKai TC","Kaiti SC","STKaiti","KaiTi",serif;
  --f-note:"Noteworthy","Bradley Hand","Segoe Print",cursive;
  --f-code:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121211; --surface:#121211; --sunk:#1c1b19; --ink:#f2efe7; --text:#e6e3db; --soft:#cdc9bf; --muted:#a19d93; --faint:#7c786f;
  --line:#2a2925; --line-strong:#454239; --accent:#e3cf9f; --accent-soft:rgba(227,207,159,.09); --on-accent:#121211;
  --hl:#e8806f; --hl-bg:rgba(232,128,111,.13); --warn:#e3b965; --warn-bg:rgba(227,185,101,.12); --ok:#7cc49b; --ok-bg:rgba(124,196,155,.12);
  --shadow:rgba(0,0,0,.55); --underline:rgba(242,239,231,.35); --selection:rgba(227,207,159,.28); --note:rgba(230,226,216,.55);
  --glow:radial-gradient(ellipse 1100px 560px at 50% -160px,rgba(227,207,159,.075),transparent 70%); --ind-glow:0 0 10px rgba(227,207,159,.55);
  --heat:227,207,159; --heat0:rgba(242,239,231,.06); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121211; --surface:#121211; --sunk:#1c1b19; --ink:#f2efe7; --text:#e6e3db; --soft:#cdc9bf; --muted:#a19d93; --faint:#7c786f;
  --line:#2a2925; --line-strong:#454239; --accent:#e3cf9f; --accent-soft:rgba(227,207,159,.09); --on-accent:#121211;
  --hl:#e8806f; --hl-bg:rgba(232,128,111,.13); --warn:#e3b965; --warn-bg:rgba(227,185,101,.12); --ok:#7cc49b; --ok-bg:rgba(124,196,155,.12);
  --shadow:rgba(0,0,0,.55); --underline:rgba(242,239,231,.35); --selection:rgba(227,207,159,.28); --note:rgba(230,226,216,.55);
  --glow:radial-gradient(ellipse 1100px 560px at 50% -160px,rgba(227,207,159,.075),transparent 70%); --ind-glow:0 0 10px rgba(227,207,159,.55);
  --heat:227,207,159; --heat0:rgba(242,239,231,.06); color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:72px;padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--bg);background-image:var(--glow);background-repeat:no-repeat;background-attachment:fixed;color:var(--text);font:16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums}
::selection{background:var(--selection)}
img{max-width:100%}
[hidden]{display:none!important}
a{color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;text-decoration-color:var(--underline);text-underline-offset:3px}
a:hover{text-decoration-color:var(--ink)}
:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
button,input,select,textarea{font-family:inherit}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* masthead, after the homepage header */
.mast{padding-top:30px}
.mast-row{display:flex;align-items:flex-end;gap:14px 18px;flex-wrap:wrap;padding-bottom:16px}
.brand-wrap{min-width:0}
.brand{font-weight:400;font-size:2.3rem;line-height:1.1;margin:0;color:var(--ink)}
.brand-sub{margin:.4rem 0 0;color:var(--muted);font-size:.95rem}
.brand-sub .zh{font-family:var(--f-zh);letter-spacing:.04em;color:var(--soft);margin:0 .15em 0 .3em}
.brand-note{margin:.35rem 0 0;font-family:var(--f-note);font-weight:300;letter-spacing:.015em;color:var(--note);font-size:.92rem}
.mast-tools{display:flex;gap:10px;align-items:center;margin-left:auto;flex:1 1 340px;justify-content:flex-end;min-width:0}
.search{position:relative;flex:1 1 180px;max-width:290px;min-width:0}
.search input{width:100%;font:15.5px var(--f-body);color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line-strong);border-radius:0;padding:4px 30px 5px 2px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--faint);font-style:italic}
.search input:focus{outline:none;border-bottom-color:var(--ink)}
.search input:not(:placeholder-shown)+kbd{display:none}
.search kbd{position:absolute;right:2px;top:50%;transform:translateY(-50%);font:12px var(--f-code);color:var(--faint);border:1px solid var(--line);border-radius:3px;padding:0 5px;pointer-events:none}
.results{position:absolute;right:0;top:calc(100% + 8px);width:min(560px,calc(100vw - 32px));max-height:60vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:4px;box-shadow:0 14px 36px var(--shadow);padding:6px;z-index:40}
.results button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--text);font:15px/1.5 var(--f-body);padding:8px 10px;border-radius:3px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--sunk)}
.results .rt{font-variant-caps:all-small-caps;letter-spacing:.08em;font-size:14px;color:var(--muted);display:block}
.results mark{background:var(--warn-bg);color:var(--ink);border-radius:2px}
.results .empty{padding:10px;color:var(--faint);font-style:italic}
.iconbtn,.sync{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;font:15.5px var(--f-body);font-variant-caps:all-small-caps;letter-spacing:.06em;padding:1px 12px 3px;cursor:pointer;white-space:nowrap}
.iconbtn:hover,.sync:hover{color:var(--ink);border-color:var(--line-strong)}
.sync[data-s="ok"]{color:var(--ok)} .sync[data-s="dirty"],.sync[data-s="saving"]{color:var(--warn)}
.sync[data-s="error"],.sync[data-s="auth"],.sync[data-s="offline"]{color:var(--hl);border-color:var(--hl)}
#settings-btn[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.theme-toggle{display:inline-flex;align-items:center;justify-content:center;flex:none;width:2rem;height:2rem;padding:0;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--muted);cursor:pointer;transition:color .2s ease,border-color .2s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
.theme-toggle:hover{color:var(--ink);border-color:var(--line-strong);transform:rotate(-25deg)}
.theme-toggle svg{width:1rem;height:1rem}
.theme-toggle .icon-sun,.theme-toggle.is-dark .icon-moon{display:none}
.theme-toggle.is-dark .icon-sun{display:block}
html.theme-switching *,html.theme-switching *::before,html.theme-switching *::after{transition:none!important}
html.theme-switching::view-transition-old(root),html.theme-switching::view-transition-new(root){animation:none;mix-blend-mode:normal}
html.theme-switching::view-transition-new(root){z-index:2}

/* section nav, after the homepage nav: hairlines above and below, an ink underline that follows the pointer */
.tabbar{position:sticky;top:0;z-index:30;background:var(--bg)}
.tabs{position:relative;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab-list{display:flex;gap:0 1.5rem;padding:11px 0 12px;width:max-content}
.tab{appearance:none;border:0;background:none;padding:0;font:16.5px var(--f-body);color:var(--muted);white-space:nowrap;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600}
.tab .n{font-size:.72em;color:var(--hl);margin-left:3px;vertical-align:.4em;font-weight:400}
.tab-ind{position:absolute;left:0;bottom:6px;height:1.5px;width:0;border-radius:1px;background:var(--accent);box-shadow:var(--ind-glow);pointer-events:none}
.tab-ind.ready{transition:transform 420ms cubic-bezier(.2,.8,.2,1),width 420ms cubic-bezier(.2,.8,.2,1)}

/* sheet */
main{padding-block:30px 40px}
.panel{display:grid;gap:30px}
@media (prefers-reduced-motion: no-preference){.panel:not([hidden]){animation:rise .42s cubic-bezier(.2,.8,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(10px)}}}
h3{font-weight:400;font-style:italic;font-size:1.2rem;line-height:1.3;margin:0;color:var(--ink);text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:70ch;font-style:italic}
.box{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px 18px;min-width:0;display:grid;gap:10px;align-content:start;grid-template-columns:minmax(0,1fr)}
.grid2{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));align-items:start}
.stack{display:grid;gap:22px;align-content:start;min-width:0}
.stack>.btn{justify-self:start}
ul.list{margin:0;padding-left:1.15em;display:grid;gap:4px}
ul.list li{min-width:0;overflow-wrap:anywhere}
ul.list li::marker{color:var(--faint)}
ul.list ul.list{margin-top:3px;color:var(--muted);font-size:15px}
.para{margin:0;overflow-wrap:anywhere}
strong{font-weight:600}
.k{font-variant-caps:all-small-caps;letter-spacing:.08em;color:var(--muted);font-size:15.5px}
.muted{color:var(--muted)} .small{font-size:14.5px}
.blank{color:var(--faint);font-style:italic;font-size:15px;margin:0}

/* connect and sign-in */
.hero{display:grid;gap:8px;padding:4px 0}
.umb{font-weight:400;font-style:italic;font-size:2rem;line-height:1.2;margin:0;color:var(--ink);text-wrap:balance}
.umb-sub{margin:0;color:var(--muted);max-width:62ch}
.connect{max-width:620px;margin:6px auto 0;display:grid;gap:18px}
.connect ol{margin:0;padding-left:1.3em;display:grid;gap:6px;font-size:15.5px}
.connect code,.box code{font:13.5px var(--f-code);background:var(--sunk);padding:1px 5px;border-radius:3px}
.connect label.fl{display:grid;gap:3px;font-size:15px;color:var(--muted)}
.err{color:var(--hl);font-size:15px;margin:0}
.okmsg{color:var(--ok);font-size:15px;margin:0}
.reccode{font:19px/1.4 var(--f-code);letter-spacing:.06em;color:var(--ink);background:var(--sunk);padding:12px 14px;border-radius:3px;margin:0;user-select:all;overflow-wrap:anywhere}

/* controls */
select.pill{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background-color:transparent;color:var(--muted);font:15.5px/1.2 var(--f-body);font-variant-caps:all-small-caps;letter-spacing:.05em;padding:1px 22px 3px 9px;border-radius:999px;cursor:pointer;max-width:100%;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 11px) 55%,calc(100% - 7px) 55%;background-size:4px 4px;background-repeat:no-repeat}
select.pill option{font-variant-caps:normal}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chipbtn{border:1px solid var(--line);background:transparent;color:var(--muted);font:15.5px var(--f-body);font-variant-caps:all-small-caps;letter-spacing:.06em;padding:0 11px 2px;border-radius:999px;cursor:pointer}
.chipbtn:hover{color:var(--ink);border-color:var(--line-strong)}
.chipbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.linkbtn{border:0;background:none;color:var(--soft);font:15px var(--f-body);padding:2px 0;cursor:pointer;justify-self:start;text-align:left;text-decoration:underline;text-decoration-thickness:1px;text-decoration-color:var(--underline);text-underline-offset:3px}
.linkbtn:hover{color:var(--ink);text-decoration-color:var(--ink)}
.linkbtn.muted{color:var(--muted)} .linkbtn.danger{color:var(--hl);text-decoration-color:currentColor}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);font:15.5px var(--f-body);padding:3px 14px 5px;border-radius:3px;cursor:pointer;white-space:nowrap}
.btn:hover{opacity:.86}
.btn:disabled{opacity:.5;cursor:progress}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn.ghost:hover{border-color:var(--ink);opacity:1}
.btn.danger{border-color:var(--hl);color:var(--hl);background:transparent}
.btn.sm{font-size:14.5px;padding:0 10px 2px}
.tag{font-size:14px;line-height:1;font-variant-caps:all-small-caps;letter-spacing:.06em;padding:2px 6px 3px;border-radius:3px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tags{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:1px;margin-left:4px}
.field,input.field,textarea.field,select.field{font:15.5px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:5px 9px;min-width:0;width:100%}
.field:focus{outline:none;border-color:var(--ink)}
.field::placeholder{color:var(--faint);font-style:italic}
textarea.field{min-height:84px;resize:vertical;line-height:1.55}
textarea.code{font:13.5px/1.6 var(--f-code)}
input[type=date].field{font:14.5px var(--f-body);width:auto}
form.edit{display:grid;gap:8px;padding:12px 14px;border:1px dashed var(--line-strong);border-radius:4px;background:var(--sunk)}
form.edit label{display:grid;gap:3px;font-size:14.5px;color:var(--muted)}
form.edit .row2{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.btnrow{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center}
.hint{font-size:14px;color:var(--faint);margin:0;font-style:italic}

/* to-dos */
.todos{display:grid;min-width:0}
.td{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;padding:5px 0;border-top:1px dotted var(--line);min-width:0}
.todos > .td:first-child{border-top:0}
.td input[type=checkbox],.lc input,.ms input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;margin:0;flex:none}
.td-t{flex:1 1 0;min-width:8em;font-size:15.5px;cursor:pointer;overflow-wrap:anywhere}
.td.done .td-t{text-decoration:line-through;text-decoration-color:var(--faint);color:var(--faint)}
button.td-t{border:0;background:none;padding:2px 4px;margin-left:-4px;text-align:left;color:inherit;font:inherit;font-size:15.5px;cursor:text;border-radius:3px}
button.td-t:hover{background:var(--sunk)}
.td-edit{flex:1 1 220px;min-width:0;display:flex}
.td-edit .field{padding:3px 8px}
.pen,.x,.wx,.star{border:0;background:none;color:var(--faint);line-height:1;cursor:pointer;border-radius:3px;flex:none}
.pen{font-size:15px;padding:5px 6px} .x{font-size:17px;padding:2px 5px} .wx{font-size:18px;padding:2px 6px} .star{font-size:16px;padding:5px 6px}
.pen:hover,.pen:focus-visible,.star:hover{background:var(--sunk);color:var(--ink)}
.x:hover,.wx:hover,.wx:focus-visible{color:var(--hl);background:var(--sunk)}
.star.on{color:var(--warn)}
@media (hover:hover){.it-row .pen{opacity:0}.it-row:hover .pen,.it-row:focus-within .pen{opacity:1}}
input.ddl{font:14px var(--f-body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:3px;padding:1px 5px;max-width:10em}
input.ddl:not(.has){opacity:.5}
.due{font-size:14.5px;line-height:1;font-variant-caps:all-small-caps;letter-spacing:.05em;padding:2px 7px 4px;border-radius:999px;white-space:nowrap}
.due.over{background:var(--hl-bg);color:var(--hl)} .due.soon{background:var(--warn-bg);color:var(--warn)} .due.later{background:var(--sunk);color:var(--muted)}
.wkb{border:0;background:none;color:var(--faint);font:15px var(--f-body);font-variant-caps:all-small-caps;letter-spacing:.05em;padding:1px 5px 3px;border-radius:3px;cursor:pointer;white-space:nowrap}
.wkb:hover{background:var(--sunk);color:var(--ink)}
.wkb.on{color:var(--ink);background:var(--accent-soft)}
.wkb.foc.on{color:var(--warn);font-weight:600}
.ichip{border:0;background:none;color:var(--muted);font:italic 14.5px var(--f-body);padding:1px 3px;cursor:pointer;max-width:18em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
.ichip:hover{color:var(--ink);text-decoration-color:var(--ink)}
form.add{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:6px}
form.add input[type=text]{flex:1 1 200px;width:auto}
form.add select.field{flex:0 1 230px;width:auto;max-width:100%}
form.add.slim{padding-top:0}
form.add.slim input[type=text],form.add.slim textarea{flex:1 1 200px;width:auto}
form.add.slim textarea{min-height:0}
.rep-l{display:flex;gap:5px;align-items:center;font-size:14.5px;color:var(--muted);white-space:nowrap;cursor:pointer}
.act{display:inline-flex;gap:2px;align-items:center}
@media (hover:hover){.td .act,.fr .act{opacity:0;transition:opacity .12s}.td:hover .act,.td:focus-within .act,.fr:hover .act,.fr:focus-within .act{opacity:1}}
.more{display:none;border:0;background:none;color:var(--faint);font-size:16px;line-height:1;padding:2px 6px;border-radius:3px;cursor:pointer;margin-left:auto}
@media (hover:none){.td .act{display:none}.td.show-act .act{display:flex;flex-wrap:wrap;flex-basis:100%;justify-content:flex-end;gap:6px}.td .more{display:inline-block;margin-left:0}}
.td>.due,.td>.wkb,.td>.tag,.td>.ichip{flex:none}
.td.focus{background:var(--warn-bg);border-radius:3px;padding-left:8px;padding-right:8px;margin:2px -8px;border-top-color:transparent}
.td.focus+.td{border-top-color:transparent}
.tag.foc{color:var(--warn);background:var(--warn-bg)}
.tag.rep{color:var(--soft);background:var(--accent-soft)}

/* progress log */
.log{display:grid;gap:0;font-size:15px}
.log-e{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:10px;padding:5px 0;border-top:1px dotted var(--line);align-items:baseline}
.log-e:first-child{border-top:0}
.log-e .d{font-variant-caps:all-small-caps;letter-spacing:.05em;color:var(--muted);font-variant-numeric:tabular-nums lining-nums;font-size:15px}
.log-e.auto .t{color:var(--muted);font-style:italic}
.log-e .x{font-size:15px;padding:0 4px}
.lastlog{font-size:14.5px;color:var(--muted);font-style:italic;min-width:0;flex:1 1 160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lastlog .d{font-style:normal;font-variant-caps:all-small-caps;margin-right:6px}

/* week */
.wknav{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.wklabel{font-weight:400;font-style:italic;font-size:2rem;line-height:1.2;margin:0;color:var(--ink)}
.wklabel span{font-style:normal;font-size:15.5px;color:var(--muted);margin-left:8px;font-variant-caps:all-small-caps;letter-spacing:.06em}
.wkgrid{display:grid;gap:22px;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:start}
textarea.goal{font-size:17px;font-style:italic;min-height:0;border-color:transparent;border-bottom-color:var(--line-strong);border-radius:0;background:transparent;padding:4px 2px}
textarea.goal:focus{border-bottom-color:var(--ink)}
.plan.box{gap:6px}
.grp{display:grid;gap:2px}
.grp-k{font-variant-caps:all-small-caps;letter-spacing:.09em;color:var(--muted);font-size:15.5px;padding-top:8px}
.wk-it{display:grid;padding-top:2px}
.wk-it-h{justify-self:start;border:0;background:none;padding:4px 0 0;font:italic 15px var(--f-body);color:var(--muted);cursor:pointer;text-align:left}
.wk-it-h:hover{color:var(--ink)}
.meter{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted);font-variant-caps:all-small-caps;letter-spacing:.06em}
.bar{height:3px;border-radius:2px;background:var(--line);overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.hist{display:grid}
.hist button{display:grid;grid-template-columns:120px 1fr auto;gap:4px 14px;align-items:baseline;text-align:left;border:0;border-top:1px solid var(--line);background:none;color:var(--text);padding:9px 4px;cursor:pointer;font:15px var(--f-body)}
.hist button:first-child{border-top:0}
.hist button:hover{background:var(--sunk)}
.hist .w{font-variant-caps:all-small-caps;letter-spacing:.05em}
.hist .w small{display:block;color:var(--muted);font-size:14px}
.hist .g{color:var(--muted);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hist .s{font-size:14.5px;color:var(--muted);white-space:nowrap;font-variant-caps:all-small-caps}
.h-sm{font-weight:400;font-style:italic;font-size:1.15rem;margin:0;color:var(--ink)}
.focus-box{border-color:var(--warn)}
.focus-box .h-sm{color:var(--warn)}
.goalmini{display:grid;gap:2px}
.goalmini button{display:flex;gap:10px;align-items:center;border:0;border-top:1px dotted var(--line);background:none;color:var(--text);padding:6px 0;cursor:pointer;text-align:left;font:15px var(--f-body)}
.goalmini button:first-child{border-top:0}
.goalmini button:hover .gt{text-decoration:underline;text-decoration-color:var(--underline);text-underline-offset:3px}
.goalmini .gt{flex:1;min-width:0}

/* timeline periods, channels, conversations, career */
.tl-p{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tl-p:first-child{border-top:0}
.tl-when{font-size:15px;padding-top:6px;font-variant-caps:all-small-caps;letter-spacing:.05em}
.tl-p.now .tl-when{color:var(--hl)}
.tl-p.past{opacity:.6}
.fr{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:9px 0;border-top:1px solid var(--line)}
.fr:first-child{border-top:0}
.fr-t{flex:1 1 160px;min-width:0}
.fr-t small{display:block;color:var(--muted);font-size:14px;font-style:italic}
.age{font-size:14.5px;line-height:1;font-variant-caps:all-small-caps;letter-spacing:.05em;padding:2px 8px 4px;border-radius:999px;white-space:nowrap;min-width:5.5em;text-align:center}
.age.ok{color:var(--ok);background:var(--ok-bg)} .age.warn{color:var(--warn);background:var(--warn-bg)} .age.bad{color:var(--hl);background:var(--hl-bg)} .age.na{color:var(--muted);background:var(--sunk)}
.ch-box{padding:4px 18px}
.convs{display:grid;gap:14px;max-width:820px}
.conv{margin:0}
.conv-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.who{font-style:italic;font-size:1.1rem;color:var(--ink)}
.date{font-size:14.5px;color:var(--muted);font-variant-caps:all-small-caps;letter-spacing:.05em}
.conv ul.list{font-size:15.5px}
.rank{font-size:14px;font-variant-caps:all-small-caps;letter-spacing:.06em;padding:1px 7px 3px;border-radius:3px;background:var(--accent-soft);color:var(--soft);white-space:nowrap}
.formula{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.fx{display:grid;gap:2px;align-content:start}
.fx b{font-weight:400;font-size:2.6rem;line-height:1;color:var(--ink)}
.fx small{color:var(--muted);font-size:14.5px;font-style:italic}
.slot{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center}
.slot b{font-weight:400;font-size:1.3rem;font-style:italic;color:var(--muted);text-align:center}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:15px}
.chain span{padding:2px 9px 3px;border-radius:3px;background:var(--sunk)}
.chain i{font-style:normal;color:var(--faint)}
.lc{display:flex;gap:8px;align-items:flex-start;font-size:15.5px;padding:3px 0;cursor:pointer}
.lc input{margin-top:5px}
.lc.done span{color:var(--faint);text-decoration:line-through}
.rate{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 0;border-top:1px solid var(--line)}
.rate:first-child{border-top:0}
.rate-t{flex:1 1 260px;min-width:0;font-size:15.5px}
.dots{display:flex;gap:4px}
.dots button{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);font:13px var(--f-body);cursor:pointer;padding:0}
.dots button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.inbox-i{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px dotted var(--line)}
.inbox-i:first-child{border-top:0}
.inbox-i p{margin:0;flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.5px}

/* toasts */
.update{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;background:var(--bg);color:var(--ink);border:1px solid var(--line-strong);font:15px var(--f-body);padding:8px 10px 8px 14px;border-radius:4px;box-shadow:0 8px 24px var(--shadow);z-index:49;max-width:calc(100vw - 32px)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);font:15px var(--f-body);padding:8px 14px;border-radius:4px;z-index:50;max-width:calc(100vw - 32px)}
.flash{outline:1.5px solid var(--warn);outline-offset:3px;border-radius:4px}
@media (prefers-reduced-motion: no-preference){.flash{animation:fl 1.6s ease-out forwards}@keyframes fl{0%,60%{outline-color:var(--warn)}100%{outline-color:transparent}}}

/* collapsible windows */
.page-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.page-h h1{font-weight:400;font-style:italic;font-size:2rem;line-height:1.2;margin:0;color:var(--ink)}
.page-h .aside{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.narrow{max-width:860px;margin:0 auto;width:100%}
.list-i{display:grid;gap:8px}
.it{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0}
.it-row{display:flex;align-items:center;gap:4px 8px;padding:2px 10px 2px 4px;min-width:0;flex-wrap:wrap}
.it-h{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--ink);font:16.5px/1.35 var(--f-body);text-align:left;padding:8px 6px;cursor:pointer;border-radius:3px}
.it-h:hover{background:var(--sunk)}
.it-t{min-width:0;overflow-wrap:anywhere}
.it-meta{display:flex;gap:8px;align-items:center;font-size:14.5px;color:var(--muted);white-space:nowrap;font-variant-caps:all-small-caps;letter-spacing:.04em}
.car{display:inline-block;width:.75em;flex:none;text-align:center;font-style:normal;font-size:1.15em;line-height:1;color:var(--faint);transition:transform .2s ease,color .2s ease}
.car::before{content:"\203A"}
.open>.it-row .car,.open>.grp-hd .car,.sub-x.open .mini-h .car{transform:rotate(90deg);color:var(--ink)}
@media (prefers-reduced-motion: reduce){.car{transition:none}}
.xb{display:grid;gap:10px;min-width:0}
/* grid tracks that may shrink below their content, so long notes and to-dos wrap instead of overflowing on phones */
.xb,.stack,.list-i,.grp-s,.todos{grid-template-columns:minmax(0,1fr)}
.it>.xb{border-top:1px dotted var(--line);padding:12px 16px 14px 32px}
.grp-s{display:grid;gap:12px;min-width:0}
.grp-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grp-btn{display:flex;align-items:baseline;gap:8px;border:0;background:none;color:var(--ink);cursor:pointer;padding:2px 0;font:inherit}
.grp-btn h2{font-weight:400;font-style:italic;font-size:1.5rem;line-height:1.25;margin:0;color:var(--ink)}
.grp-btn .car{align-self:center}
.cnt{font-size:15px;color:var(--faint);font-variant-numeric:tabular-nums}
.grp-hd .aside{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.proj-id{font-size:15px;line-height:1;font-variant-caps:all-small-caps;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line-strong);border-radius:3px;padding:1px 5px 3px;flex:none}
.tgt{font-style:italic;color:var(--faint);font-size:15px;white-space:nowrap}
.meta{font-size:15px;color:var(--muted)}
.row-sub{font-size:15.5px;color:var(--soft)}
.row-foot{display:flex;gap:4px 16px;flex-wrap:wrap;align-items:center}
.sub-x>.it-row{padding:0}
.sub-x>.xb{padding-top:6px}
.mini-h{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font:15px var(--f-body);cursor:pointer;padding:4px 2px;font-variant-caps:all-small-caps;letter-spacing:.06em}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.notes ul.list{font-size:15.5px}
.cluster{display:grid;gap:12px}
.cluster-k{font-variant-caps:all-small-caps;letter-spacing:.1em;color:var(--muted);font-size:16px;padding-top:10px;border-top:1px solid var(--line)}
.filters{display:grid;gap:8px}
.tag.restore{display:inline-flex;gap:8px;align-items:center;padding:4px 9px 5px;font-size:14.5px}
.stus{padding:2px 16px}
.stu{display:grid;gap:2px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.stu:first-child{border-top:0}
.stu-h{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.stu-n{font-weight:600;min-width:7.5em}
.pchips{display:flex;gap:5px;flex-wrap:wrap;align-items:center;flex:1 1 220px;min-width:0}
.pchip{border:1px solid var(--line);background:transparent;color:var(--muted);font:14.5px var(--f-body);font-variant-caps:all-small-caps;min-width:30px;padding:1px 7px 3px;border-radius:3px;cursor:pointer}
.pchip:hover{border-color:var(--ink);color:var(--ink)}
.pchip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pchip.wide{font-variant-caps:normal;max-width:18em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchips select.pill{max-width:11em}
.act-r{display:flex;gap:2px;margin-left:auto}
@media (hover:hover){.stu-h .act-r{opacity:0}.stu:hover .act-r,.stu:focus-within .act-r{opacity:1}}
.it-row select.st{border-color:transparent}
.it-row:hover select.st,.it-row select.st:focus-visible{border-color:var(--line)}
.gbar{display:inline-block;width:56px;height:3px;border-radius:2px;background:var(--line);overflow:hidden;vertical-align:middle}
.gbar i{display:block;height:100%;background:var(--accent)}

/* resources: live server usage */
.glance{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.gl{display:grid;grid-template-columns:auto 1fr;gap:0 8px;align-items:baseline;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:4px;padding:8px 12px;cursor:pointer;font:15.5px var(--f-body)}
.gl:hover{border-color:var(--line-strong)}
.gl b{font-weight:600}
.gl>span:last-child{grid-column:2;color:var(--muted);font-size:14.5px}
.srvs{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.srv{gap:12px}
.srv-h{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.srv-h h3{font-size:1.4rem}
.srv-st{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-variant-caps:all-small-caps;letter-spacing:.06em;color:var(--muted)}
.srv-st i{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.srv-st.live{color:var(--ok)} .srv-st.live i{background:var(--ok)}
.srv-st.stale{color:var(--warn)} .srv-st.stale i{background:var(--warn)}
.srv-st.off{color:var(--hl)} .srv-st.off i{background:var(--hl)}
@media (prefers-reduced-motion: no-preference){.srv-st.live i{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.3}}}
.srv-meta{font-size:14px;color:var(--faint);margin-left:auto;font-variant-numeric:tabular-nums}
.rrows{display:grid;gap:5px}
.rrow{display:grid;grid-template-columns:6.5em minmax(70px,1fr) 10.5em 90px minmax(170px,1.5fr);gap:10px;align-items:center;font-size:14.5px}
.rk{font-variant-caps:all-small-caps;letter-spacing:.07em;color:var(--muted);font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk span{color:var(--soft);margin-left:6px}
.rv{font-variant-numeric:tabular-nums;color:var(--soft);white-space:nowrap}
.rbar{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:30px}
.rbar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.rbar.warm i{background:var(--warn)} .rbar.hot i{background:var(--hl)}
.spark{color:var(--faint);display:block}
.spark path{fill:none;stroke:currentColor;stroke-width:1.2;stroke-linejoin:round}
.gpus{display:grid;gap:0}
.gpu{display:grid;grid-template-columns:1.2em 6.5em minmax(60px,.8fr) minmax(110px,1fr) 2.3em 60px minmax(170px,1.5fr);gap:2px 10px;align-items:center;font-size:14.5px;padding:4px 0;border-top:1px dotted var(--line)}
.gpus>.rk{padding-bottom:3px}
.gpus .gfree{color:var(--ok)}
.gpus+.rrows{padding-top:4px}
.gi{color:var(--faint);font-variant-numeric:tabular-nums}
.gn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gm{display:grid;grid-template-columns:minmax(24px,1fr) auto;gap:6px;align-items:center;font-variant-numeric:tabular-nums;color:var(--soft);white-space:nowrap}
.gt{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right} .gt.warm{color:var(--warn)} .gt.hot{color:var(--hl)}
.gu{display:flex;flex-wrap:wrap;gap:0 12px;font-size:14px;color:var(--muted);min-width:0;line-height:1.35}
.gu b{font-weight:600;color:var(--soft)}
.gu .free{color:var(--ok);font-variant-caps:all-small-caps;letter-spacing:.06em}
ol.steps{margin:0;padding-left:1.3em;display:grid;gap:10px;font-size:15.5px}
ol.steps pre{margin:6px 0;padding:8px 10px;background:var(--sunk);border-radius:3px;overflow-x:auto}
ol.steps pre code{font:13px var(--f-code);background:none;padding:0;white-space:pre}
@media (max-width:700px){.rrow{grid-template-columns:5.2em minmax(40px,1fr) auto}.rrow>.spark,.rrow>span:empty{display:none}.rrow>.gu{grid-column:2/-1}
  .gpu{grid-template-columns:1.1em minmax(40px,1fr) minmax(100px,1.3fr) 2.2em}.gpu .gn,.gpu .spark{display:none}.gpu>.gu{grid-column:2/-1}.srv-meta{margin-left:0}}

/* deadlines kept in view */
.dls{display:flex;flex-wrap:wrap;gap:10px 36px;align-items:flex-end}
.dl{display:flex;gap:12px;align-items:baseline}
.dl b{font-weight:400;font-size:2.6rem;line-height:1;color:var(--ink);font-variant-numeric:lining-nums}
.dl.soon b{color:var(--hl)}
.dl span{color:var(--muted);font-size:15.5px;line-height:1.35}
.dl strong{color:var(--ink);font-weight:600}
.dl small{display:block;font-size:14px;color:var(--faint);font-style:italic}
.dl-ed{align-self:center}
@media (max-width:700px){.dl b{font-size:2.1rem}}

/* a project's open problems and solved items, read from its code repository */
.rb{border-top:1px dotted var(--line);padding:10px 16px 12px 32px;display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.rb-h{display:flex;flex-wrap:wrap;gap:2px 14px;align-items:baseline;font-size:14.5px;color:var(--faint)}
.rb-h a{color:var(--muted)}
.rb-k{font-variant-caps:all-small-caps;letter-spacing:.08em;color:var(--muted);font-size:15.5px}
.rb-cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:10px 28px;align-items:start}
.rb-col{display:grid;grid-template-columns:minmax(0,1fr);align-content:start;min-width:0}
.rb-t{font-style:italic;color:var(--ink);font-size:16px;padding-bottom:2px}
.rb-sec{font-size:14px;color:var(--faint);font-style:italic;padding:8px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi-h,.pr{display:flex;align-items:baseline;gap:8px;width:100%;min-width:0;border:0;border-top:1px dotted var(--line);background:none;color:var(--text);font:15px/1.4 var(--f-body);text-align:left;padding:5px 2px;cursor:pointer;text-decoration:none}
.pi-h:hover .pt,.pr:hover .pt{text-decoration:underline;text-decoration-color:var(--underline);text-underline-offset:3px}
.pn{flex:none;min-width:1.7em;font-size:14px;color:var(--faint);font-variant-numeric:tabular-nums}
.pt{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.pk{flex:none;font-size:14px;line-height:1;font-variant-caps:all-small-caps;letter-spacing:.05em;padding:2px 7px 4px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pk.warn{background:var(--warn-bg);color:var(--warn)} .pk.ok{background:var(--ok-bg);color:var(--ok)}
.pr .d{flex:none;font-size:14px;color:var(--faint);font-variant-caps:all-small-caps;letter-spacing:.04em}
.pi>.xb{gap:5px;padding:0 4px 10px calc(1.7em + 10px);font-size:14.5px;color:var(--soft);line-height:1.5}
.pi>.xb p{margin:0;overflow-wrap:anywhere}
.pi-st{color:var(--ink)}
.pi-f{color:var(--faint);font-style:italic}
.pi-f a{color:var(--muted)}
.rb .sub-x{border-top:1px dotted var(--line)}
.rb .sub-x>.xb{padding-top:0}
@media (max-width:720px){.rb-cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.rb{padding:8px 12px 10px 14px}}

.site-foot{padding-block:8px 36px;color:var(--faint);font-size:14.5px;font-style:italic;display:flex;gap:6px 18px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.site-foot a{color:var(--muted)}

@media (max-width:860px){.wkgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){
  .mast{padding-top:18px}
  .brand{font-size:2rem}
  .mast-tools{flex-basis:100%;justify-content:flex-start;flex-wrap:wrap}
  .search{max-width:none;flex:1 1 100%}
}
@media (max-width:560px){
  .tl-p{grid-template-columns:68px minmax(0,1fr)}
  .formula{gap:8px} .fx b{font-size:2rem}
  .hist button{grid-template-columns:96px 1fr}
  .hist .s{grid-column:2}
  .log-e{grid-template-columns:62px minmax(0,1fr) auto}
  .it-h{flex-basis:100%}
  .it-row{padding:2px 8px 6px 4px}
  .it-row>.it-meta{margin-left:30px}
  .ichip{max-width:80vw}
  .td-t,button.td-t{flex-basis:calc(100% - 30px)}
  .it>.xb{padding:10px 12px 12px 14px}
  .page-h h1,.wklabel{font-size:1.7rem}
  .arc-labs{display:none}
  .yl-l{display:none}
  .ms{grid-template-columns:auto minmax(0,1fr) auto}
  .ms-d{grid-column:2;grid-row:1}
  .ms-t{grid-column:2;grid-row:2}
  .ms-r{grid-column:3;grid-row:1/3}

<script>
(function(){

  proj:['Starting','Pushing','Submitting','In review','Maintaining','Paused','Done'],

  intern:['Idea','Reaching out','Applied','Interviewing','Offer','Dropped'],

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    if(all.every(x=>isObj(x)&&typeof x.id==='string')){
      const bm=new Map((Array.isArray(b)?b:[]).filter(x=>isObj(x)&&x.id).map(x=>[x.id,x]));

/* Storage. Preferences live in localStorage. The GitHub token and the cached plans live in

const mkStore=get=>({get(k){try{return JSON.parse(get().getItem(k)||'null')}catch(e){return null}},

/* line format used by every editable block:

    if(m){const lvl=m[1].length>=2?1:0;list=list||[];
      if(lvl===0||!list.length)list.push({t:m[2],sub:[]});else list[list.length-1].sub.push(m[2]);continue}

/* ============================== state ============================== */

const T={editStudent:'',addingStudent:false,editTodo:'',ddlOpen:{},editBlock:'',editItem:'',adding:'',editConv:'',editMs:'',editPhd:false,confirm:'',connectErr:'',connectStage:'',stale:{},vault:null,pwMsg:'',pwErr:'',msgK:'',busy:'',screen:'',recShow:'',pending:null,recovered:null,unlocked:null,editSrv:false,editDl:false,calSel:'',editHours:false,peek:''};
const saveUI=()=>ls.set(UI_KEY,U);
let IX={items:new Map(),todos:new Map(),byItem:new Map()};
const adopt=x=>normalize(clone(x));

}
const itemById=id=>IX.items.get(id);
const todoById=id=>IX.todos.get(id);
const todosOf=it=>IX.byItem.get(it.id)||[];
const liveTodos=()=>D.todos.filter(t=>!t.del&&IX.items.has(t.item));
const label=it=>it.kind==='proj'?it.id+' · '+it.title:it.title;
const setOf=it=>it.set||KIND_SET[it.kind]||'todo';

const areaItems=(area,kind)=>D.items.filter(x=>x.area===area&&(!kind||x.kind===kind));
const week=wk=>D.weeks[wk]||{plan:[],goals:'',review:'',rec:{},focus:{}};
function ensureWeek(wk){if(!D.weeks[wk])D.weeks[wk]={plan:[],goals:'',review:''};const w=D.weeks[wk];w.plan=w.plan||[];w.rec=w.rec||{};w.focus=w.focus||{};return w}
const inWeek=(id,wk)=>(week(wk).plan||[]).includes(id);
const addLog=(item,t,extra)=>D.logs.push(Object.assign({id:uid(),item,d:TODAY_ISO,t},extra||{}));
const logOk=l=>!l.item||IX.items.has(l.item);

/* ============================== PhD span ============================== */
function phdSpan(){const p=D&&D.phd||{};const s=parseD(p.start)||new Date(TODAY.getFullYear()-(TODAY.getMonth()<7?1:0),7,1);
  const e=parseD(p.end)||new Date(s.getFullYear()+5,s.getMonth(),0);return [s,e]}

  const total=(e.getFullYear()-s.getFullYear())*12+e.getMonth()-s.getMonth()+1;const mo=TODAY.getMonth();
  return {m:m+1,total,yr:Math.floor(m/12)+1,sem:mo>=7?'Sem 1':mo<=4?'Sem 2':'Special term',pct:Math.max(0,Math.min(100,Math.round((TODAY-s)/(e-s)*100))),before:TODAY<s,after:TODAY>e}}

/* ============================== storage & sync ============================== */
const GH={cfg:null,
  base(){const c=this.cfg;return `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`},
  fileUrl(path){return this.base()+'/contents/'+path.split('/').map(encodeURIComponent).join('/')},
  h(accept){return {'Authorization':'Bearer '+this.cfg.token,'Accept':accept||'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}},
  async api(path,opt){const r=await fetch(this.base()+path,Object.assign({headers:this.h(),cache:'no-store'},opt||{}));if(!r.ok)throw await ghErr(r);return r.json()},
  async repo(){return this.api('')},

    if(!r.ok)throw await ghErr(r);return (await r.json()).content.sha},
  async remove(path,branch,sha,message){

    const r=await fetch(this.fileUrl(path),{method:'DELETE',headers:Object.assign(this.h(),{'Content-Type':'application/json'}),body:JSON.stringify(body)});

function paintSync(){
  const b=document.getElementById('sync');const s=Sync.status;b.dataset.s=s;
  b.textContent={none:'—',local:'local preview',ok:'synced '+Sync.lastAt,dirty:'unsaved…',saving:'saving…',offline:'offline · kept here',auth:'sign in again',error:'sync error · retry'}[s]||s;

/* ============================== encryption ==============================
   The repository is public, so the plans are encrypted in this browser before they are written: a random
   256-bit data key encrypts data.json with AES-256-GCM. vault.json, served next to this page, holds that key
   and the GitHub token, wrapped twice: once under the sign-in password and once under a recovery code, each
   through PBKDF2-SHA256 with 1,000,000 rounds. Without the password or the recovery code, everything in the
   repository is ciphertext. A wrong secret fails GCM authentication. */
const KDF_ITER=1000000,PW_MIN=12;

const REC_ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newRecovery(){let s='';for(const b of rand(24))s+=REC_ABC[b&31];return s.match(/.{4}/g).join('-')}   // 120 bits
const recNorm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const looksRec=s=>!/[a-z]/.test(s)&&recNorm(s).length===24&&[...recNorm(s)].every(c=>REC_ABC.includes(c));
const vaultOf=wraps=>({v:2,kdf:'PBKDF2-SHA256',cipher:'AES-256-GCM',wraps,at:TODAY_ISO});
const wrapOf=(v,by)=>(v&&v.wraps||[]).find(w=>w.by===by);
/* try the secret as a password and as a recovery code; returns {by, p} or throws {wrong:true} */
async function openVault(secret,v){
  for(const by of looksRec(secret)?['recovery','password']:['password','recovery']){const w=wrapOf(v,by);if(!w)continue;
    try{return {by,p:await unwrap(w,by==='recovery'?recNorm(secret):secret)}}catch(e){if(e.name!=='OperationError')throw e}}
  throw Object.assign(new Error('wrong secret'),{wrong:true})}
async function useDek(b64){DEK=await crypto.subtle.importKey('raw',b64u8(b64),{name:'AES-GCM'},false,['encrypt','decrypt'])}
const isEnv=j=>isObj(j)&&typeof j.ct==='string'&&typeof j.iv==='string'&&!Array.isArray(j.items);
async function encData(obj){const iv=rand(12);const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},DEK,te.encode(JSON.stringify(obj))));return {v:1,alg:'AES-256-GCM',iv:u8b64(iv),ct:u8b64(ct)}}
async function decData(env){return JSON.parse(tdc.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u8(env.iv)},DEK,b64u8(env.ct))))}
async function fetchVault(){if(!/^https?:/.test(location.protocol))return null;
  try{const r=await fetch('vault.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return null;const v=await r.json();return v&&Array.isArray(v.wraps)?v:null}catch(e){return null}}
const cfgOnly=c=>({owner:c.owner,repo:c.repo,branch:c.branch,path:c.path,vaultPath:c.vaultPath,siteBranch:c.siteBranch});
/* the freshest vault comes from the API (the copy served by Pages lags a minute behind a change) */
async function readVaultApi(){const c=GH.cfg;const f=await GH.read(c.vaultPath,c.siteBranch);return f.missing?{v:null,sha:null}:{v:JSON.parse(f.text),sha:f.sha}}
async function writeVault(v,sha,msg){await GH.write(GH.cfg.vaultPath,GH.cfg.siteBranch,JSON.stringify(v,null,1)+'\n',sha,msg);T.vault=v}
/* a new password wrap over the signed-in session; the recovery wrap stays as it is */
async function rewrapPassword(pw,token,msg){const c=GH.cfg;const cur=await readVaultApi();const dek=sec.get(CFG_KEY).dek;
  const pwWrap=await wrap('password',pw,{cfg:cfgOnly(c),token,dek});
  const rest=((cur.v||T.vault)||{wraps:[]}).wraps.filter(w=>w.by!=='password');
  await writeVault(vaultOf([pwWrap,...rest]),cur.sha,msg)}
async function newRecoveryWrap(){const c=GH.cfg;const cur=await readVaultApi();const rec=newRecovery();
  const w=await wrap('recovery',recNorm(rec),{cfg:cfgOnly(c),dek:sec.get(CFG_KEY).dek});
  await writeVault(vaultOf([...((cur.v||T.vault)||{wraps:[]}).wraps.filter(x=>x.by!=='recovery'),w]),cur.sha,'planner: new recovery code');return rec}

/* ---------- resources: live usage of the servers ----------
   Each server runs tools/server-monitor/plan_monitor.py, published to the tailnet by `tailscale serve`.
   While this tab is open and visible, every server is polled every few seconds and only its card is
   repainted, so nothing else on the page re-renders. The server list is part of the (encrypted) plans. */
const LIVE={timer:0,busy:false,POLL:3000,st:{},hist:{},lna:''};
/* Chrome asks before a public site may reach devices on the local network (the tailnet included); until it is
   answered, requests just wait. Track that permission so the cards can say what to click. */
(async()=>{try{const p=await navigator.permissions.query({name:'local-network-access'});LIVE.lna=p.state;
  p.onchange=()=>{LIVE.lna=p.state;if(p.state==='granted'&&LIVE.timer)monTick();if(D&&U.tab==='res')(D.servers||[]).forEach(paintServer)}}catch(e){}})();
const srvUrl=s=>String(s.url||'').trim().replace(/\/+$/,'');
const pctOf=(a,b)=>a!=null&&b?Math.round(a/b*1000)/10:null;
const gib=b=>b==null?'—':b/2**30>=100?String(Math.round(b/2**30)):(b/2**30).toFixed(1);
/* a used / total pair in one unit: GB, or TB from 1000 GB */
const sz=b=>b/2**30>=1000?[(b/2**40).toFixed(1),'TB']:[gib(b),'GB'];
const size2=(u,t)=>{const a=sz(u),b=sz(t);return a[1]===b[1]?`${a[0]} / ${b[0]} ${b[1]}`:`${a[0]} ${a[1]} / ${b[0]} ${b[1]}`};
const mibG=m=>m==null?'—':m/1024>=10?String(Math.round(m/1024)):(m/1024).toFixed(1);
const dur=s=>s>=86400?Math.floor(s/86400)+'d':s>=3600?Math.floor(s/3600)+'h':Math.max(1,Math.floor(s/60))+'m';
const bar=p=>`<span class="rbar${p>=90?' hot':p>=70?' warm':''}"><i style="width:${p==null?0:Math.max(0,Math.min(100,p))}%"></i></span>`;
const gpuFree=g=>(g.util==null||g.util<5)&&(g.mem_used==null||g.mem_used<600)&&!(g.procs||[]).length;
async function getJSON(url,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(url,{cache:'no-store',signal:c.signal,credentials:'omit'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}
  finally{clearTimeout(t)}}
async function pollServer(s){const m=LIVE.st[s.id]||(LIVE.st[s.id]={});const base=srvUrl(s);
  try{
    if(!LIVE.hist[s.id]){const h=await getJSON(base+'/history',6000);LIVE.hist[s.id]=(h.points||[]).slice(-180)}
    const x=await getJSON(base+'/metrics',5000);m.snap=x;m.ok=Date.now();m.err='';
    const H=LIVE.hist[s.id];const last=H[H.length-1];
    if(x.cpu!=null&&(!last||x.t-last[0]>=9.5)){H.push([x.t,x.cpu,pctOf(x.mem.used,x.mem.total),(x.gpus||[]).map(g=>g.util),(x.gpus||[]).map(g=>pctOf(g.mem_used,g.mem_total))]);if(H.length>180)H.shift()}
  }catch(e){m.err=e.name==='AbortError'?'no answer within 5 seconds':e.name==='TypeError'?'cannot connect':(e.message||'cannot connect')}
  paintServer(s)}
async function monTick(){if(LIVE.busy||!D)return;LIVE.busy=true;try{await Promise.all((D.servers||[]).map(pollServer));paintGlance()}finally{LIVE.busy=false}}
function monSync(){const on=!!D&&U.tab==='res'&&document.visibilityState==='visible'&&(D.servers||[]).length>0;
  if(on&&!LIVE.timer){LIVE.timer=setInterval(monTick,LIVE.POLL);monTick()}else if(!on&&LIVE.timer){clearInterval(LIVE.timer);LIVE.timer=0}}
function srvState(s){const m=LIVE.st[s.id]||{};if(!m.ok&&!m.err)return 'wait';
  return m.ok&&Date.now()-m.ok<LIVE.POLL*2+4000?'live':m.ok?'stale':'off'}
function spark(vals,w,h){w=w||90;h=h||20;const v=vals.map(x=>x==null?null:Math.max(0,Math.min(100,x)));const n=v.length;let d='',pen=false;
  if(v.filter(x=>x!=null).length>1)v.forEach((y,i)=>{if(y==null){pen=false;return}d+=(pen?'L':'M')+(i/(n-1)*w).toFixed(1)+' '+(h-1-y/100*(h-2)).toFixed(1);pen=true});
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${d?`<path d="${d}"/>`:''}</svg>`}
/* every bar carries its own "who": GPU bars list the people with processes on that GPU,
   the CPU and memory bars list the heaviest users of each */
const SYS_USERS=/^(root|gdm|nobody|messagebus|syslog|colord|polkitd|rtkit|avahi|systemd-.*|_.*|\d+)$/;
const uname=u=>u==='?'?'unknown':u;
const whoCell=items=>`<span class="gu">${items}</span>`;
function topUsers(x,key,min,fmt){
  const us=(x.users||[]).filter(u=>u[key]>=min&&(!SYS_USERS.test(u.user)||key==='cpu'&&u.cpu>=2)).sort((a,b)=>b[key]-a[key]);
  const shown=us.slice(0,3).map(u=>`<span><b>${esc(uname(u.user))}</b> ${fmt(u[key])}</span>`).join('');
  return whoCell(shown+(us.length>3?`<span title="${esc(us.slice(3).map(u=>u.user+' '+fmt(u[key])).join(', '))}">+${us.length-3} more</span>`:''))}
const rrow=(k,p,txt,sp,who)=>`<div class="rrow"><span class="rk">${k}</span>${bar(p)}<span class="rv">${txt}</span>${sp||'<span></span>'}${who||'<span></span>'}</div>`;
function gpuRow(g,hist){const mp=pctOf(g.mem_used,g.mem_total);const procs=g.procs||[];
  const agg={};for(const p of procs){const a=agg[p.user]||(agg[p.user]={n:0,mem:0,el:null,cmds:[]});a.n++;a.mem+=p.mem||0;if(p.elapsed!=null)a.el=Math.max(a.el||0,p.elapsed);if(a.cmds.length<4&&(p.cmd||p.name))a.cmds.push(p.cmd||p.name)}
  const who=procs.length?Object.entries(agg).sort((a,b)=>b[1].mem-a[1].mem).map(([u,a])=>`<span title="${esc(a.cmds.join('\n'))}"><b>${esc(uname(u))}</b>${a.n>1?' ×'+a.n:''} · ${mibG(a.mem)} GB${a.el!=null?' · '+dur(a.el):''}</span>`).join('')
    :gpuFree(g)?'<span class="free">free</span>':'';
  return `<div class="gpu"><span class="gi">${g.i}</span><span class="gn" title="${esc(g.name)}">${esc(String(g.name).replace(/^NVIDIA\s+|GeForce\s+|\s+PCIe$/g,''))}</span>
    <span class="gm">${bar(g.util)}<span>${g.util==null?'—':Math.round(g.util)+'%'}</span></span>
    <span class="gm">${bar(mp)}<span>${mibG(g.mem_used)} / ${mibG(g.mem_total)} GB</span></span>
    <span class="gt${g.temp>=85?' hot':g.temp>=75?' warm':''}">${g.temp==null?'':Math.round(g.temp)+'°'}</span>${spark(hist,60,16)}${whoCell(who)}</div>`}
function serverInner(s){const m=LIVE.st[s.id]||{},x=m.snap,H=LIVE.hist[s.id]||[],state=srvState(s);
  const label={wait:'connecting…',live:'live',stale:'stale · '+(m.ok?Math.round((Date.now()-m.ok)/1000)+' s ago':''),off:'unreachable'}[state];
  let h=`<div class="srv-h"><h3 data-find>${esc(s.name)}</h3><span class="srv-st ${state}"><i></i>${label}</span>${x?`<span class="srv-meta">${esc(x.host)} · up ${dur(x.uptime)} · load ${x.load.map(n=>n.toFixed(1)).join(' ')}</span>`:''}</div>`;
  if(s.note)h+=`<p class="hint" data-find>${md(s.note)}</p>`;
  if(!x)return h+(state==='off'?(LIVE.lna==='prompt'?`<p class="err small">Chrome is waiting for your permission.</p><p class="hint">Click <strong>Allow</strong> in the prompt next to the address bar (“look for and connect to devices on your local network”). If it is gone, click the site-settings icon left of the address and allow <em>Local network access</em>.</p>`
    :LIVE.lna==='denied'?`<p class="err small">Chrome is blocking access to devices on your network for this site.</p><p class="hint">Click the site-settings icon left of the address and set <em>Local network access</em> to Allow, then reload.</p>`
    :`<p class="err small">${esc(srvUrl(s))}: ${esc(m.err)}.</p><p class="hint">Is this device on your tailnet with Tailscale switched on? Is the agent running on the server (<code>~/.local/share/plan-monitor/run.sh</code> starts it)?</p>`):'');
  /* compute only, GPUs first: the GPUs are what people queue for; CPU and memory follow */
  const G=x.gpus||[];const free=G.filter(gpuFree).length;
  if(G.length)h+=`<div class="gpus"><div class="rk">gpus <span class="${free?'gfree':''}">${free} of ${G.length} free</span></div>${G.map((g,i)=>gpuRow(g,H.map(p=>(p[3]||[])[i]))).join('')}</div>`;
  else if(x.errors&&x.errors.gpu)h+=`<p class="hint">GPU: ${esc(x.errors.gpu)}</p>`;
  h+=`<div class="rrows">${rrow('cpu',x.cpu,`${x.cpu==null?'—':Math.round(x.cpu)+'%'} of ${x.cores} cores`,spark(H.map(p=>p[1])),topUsers(x,'cpu',0.5,c=>(c>=10?Math.round(c):c.toFixed(1))+' cores'))}
    ${rrow('memory',pctOf(x.mem.used,x.mem.total),`${size2(x.mem.used,x.mem.total)}${x.swap&&x.swap.used>2**28?` · swap ${gib(x.swap.used)}`:''}`,spark(H.map(p=>p[2])),topUsers(x,'rss',4*2**30,b=>gib(b)+' GB'))}
</div>`;
  return h}
function glanceHtml(){return (D.servers||[]).map(s=>{const m=LIVE.st[s.id]||{},x=m.snap,st=srvState(s);const G=x&&x.gpus||[];
  const txt=x?(G.length?`${G.filter(gpuFree).length}/${G.length} GPUs free · `:'')+`cpu ${x.cpu==null?'—':Math.round(x.cpu)+'%'} · mem ${Math.round(pctOf(x.mem.used,x.mem.total))}%`:st==='off'?'unreachable':'connecting…';
  return `<button type="button" class="gl" data-act="goto" data-tab="res" data-target="srv-${esc(s.id)}"><span class="srv-st ${st}"><i></i></span><b>${esc(s.name)}</b><span>${txt}</span></button>`}).join('')}
function paintGlance(){const el=document.getElementById('res-glance');if(el)el.innerHTML=glanceHtml()}
function paintServer(s){if(T.editSrv||U.tab!=='res')return;const el=document.getElementById('srv-'+s.id);if(el)el.innerHTML=serverInner(s)}
const RAW_INSTALL='https://raw.githubusercontent.com/H-tr/PhD-Plan/main/tools/server-monitor/install.sh';

/* ============================== project docs, synced from the code repositories ==============================
   .github/workflows/projects.yml reads each project's to-do file and its recently merged pull requests every
   30 minutes and leaves them on the "projects" branch, encrypted to this panel's public key. The key pair is
   made here at the first sign-in: the private half is kept only inside the encrypted plans (D.panelKey), and
   the public half is published to tools/project-sync/panel-key.json for the workflow. */
const PROJ={cache:'phd-plan.projects',pub:'tools/project-sync/panel-key.json',branch:'projects',file:'projects.json'};
const PS=Object.assign({data:null,sha:''},sec.get(PROJ.cache)||{},{checked:0,busy:false,err:'',keyOk:false});
let panelPriv=null;
async function makePanelKey(){
  const kp=await crypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:3072,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt']);
  const priv=await crypto.subtle.exportKey('jwk',kp.privateKey),pub=await crypto.subtle.exportKey('jwk',kp.publicKey);
  D.panelKey={priv,pub:{kty:pub.kty,n:pub.n,e:pub.e},at:TODAY_ISO};Sync.changed('panel key')}
/* writes the public key when the published copy is missing or belongs to another key; true if it wrote */
async function publishPanelKey(){const k=D.panelKey.pub,br=GH.cfg.siteBranch;
  const f=await GH.read(PROJ.pub,br);
  if(!f.missing){try{const j=JSON.parse(f.text);if(j.n===k.n&&j.e===k.e)return false}catch(e){}}
  await GH.write(PROJ.pub,br,JSON.stringify({v:1,alg:'RSA-OAEP-256',kty:k.kty,n:k.n,e:k.e,at:D.panelKey.at},null,1)+'\n',f.missing?null:f.sha,'panel: public key for the project sync');return true}
async function openProjects(env){const k=D.panelKey;
  if(!panelPriv||panelPriv.n!==k.pub.n)panelPriv={n:k.pub.n,key:await crypto.subtle.importKey('jwk',k.priv,{name:'RSA-OAEP',hash:'SHA-256'},false,['decrypt'])};
  const raw=await crypto.subtle.decrypt({name:'RSA-OAEP'},panelPriv.key,b64u8(env.wk));
  const aes=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  return JSON.parse(tdc.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u8(env.iv)},aes,b64u8(env.ct))))}
async function loadProjects(force){
  if(Sync.mode!=='github'||!D||PS.busy||(!force&&Date.now()-PS.checked<60e3))return;
  PS.busy=true;PS.checked=Date.now();const was=PS.err+'|'+PS.sha;
  try{
    if(!PS.keyOk){if(!D.panelKey)await makePanelKey();if(await publishPanelKey())PS.err='key-new';PS.keyOk=true}
    const f=await GH.read(PROJ.file,PROJ.branch);

/* show a collapsed element: open every collapsed ancestor and switch to its sub-page */
function reveal(el){
  for(let p=el;p&&p.id!=='panels';p=p.parentElement){
    if(p.classList.contains('xb')&&p.hidden){p.hidden=false;const box=p.parentElement;box.classList.add('open');
      const btn=box.querySelector(':scope > .it-row [data-act="exp"], :scope > .grp-hd [data-act="exp"]');if(btn)btn.setAttribute('aria-expanded','true');
      if(box.dataset.key)U.exp[box.dataset.key]=true}
    if(p.dataset&&p.dataset.sub&&p.hidden){U.sub=p.dataset.sub;const host=p.parentElement;
      host.querySelectorAll(':scope > [data-sub]').forEach(x=>{x.hidden=x!==p});
      host.querySelectorAll('.subtabs [data-act="sub"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===p.dataset.sub))}
  }
  saveUI();
}

document.getElementById('theme-toggle').addEventListener('click',()=>{
  const next=themeNow()==='dark'?'light':'dark';const done=()=>{setTheme(next);if(U.tab==='settings')render()};
  const root=document.documentElement;
  if(!document.startViewTransition||matchMedia('(prefers-reduced-motion: reduce)').matches){done();return}
  const box=document.getElementById('theme-toggle').getBoundingClientRect();const x=box.left+box.width/2,y=box.top+box.height/2;
  const radius=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  root.classList.add('theme-switching');const tr=document.startViewTransition(done);
  tr.ready.then(()=>root.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${radius}px at ${x}px ${y}px)`]},{duration:560,easing:'cubic-bezier(0.2, 0.8, 0.2, 1)',pseudoElement:'::view-transition-new(root)'})).catch(()=>{});
  tr.finished.finally(()=>root.classList.remove('theme-switching'))});

document.addEventListener('change',async e=>{
  const t=e.target,act=t.dataset&&t.dataset.act,id=t.dataset&&t.dataset.id;if(!act||!D&&act!=='seed-file')return;
  switch(act){
    case 'st':{const it=itemById(id);if(!it)return;const old=st(it);it.st=t.value;addLog(it.id,`Status: ${old} → ${t.value}`,{auto:true});commit('status');return}
    case 'done':if(t.checked){snapshot();setDone(id,true);commit('done');toast('Done',true)}else{setDone(id,false);commit('undone')}return;
    case 'ddl':{const td=todoById(id);if(td){td.ddl=t.value;delete T.ddlOpen[id];commit('due date')}return}

document.addEventListener('submit',e=>{
  const f=e.target;const kind=f.dataset&&f.dataset.form;if(!kind)return;e.preventDefault();
  /* namedItem, not elements[n]: a field named "item" would otherwise return the collection's item() method */
  const v=n=>{const el=f.elements.namedItem(n);return el?(el.type==='checkbox'?el.checked:String(el.value).trim()):''};
  const refocus=id=>{const n=document.getElementById(id);if(n)n.focus()};
  switch(kind){
    case 'login':doLogin(f.elements.pw.value,f.elements.remember.checked);return;
    case 'setup':{const cfg=Object.assign(defaultCfg(),{owner:v('owner'),repo:v('repo'),path:v('path').replace(/^\/+/,''),branch:v('branch')});const token=v('token');
      const pw=f.elements.pw.value,pw2=f.elements.pw2.value;
      if(pw!==pw2)return formErr(f,'The two passwords differ.');if(pw.length<PW_MIN)return formErr(f,`Use at least ${PW_MIN} characters for the password.`);
      T.form={owner:cfg.owner,repo:cfg.repo,path:cfg.path,branch:cfg.branch};T.tokenDraft=token;doSetup(cfg,token,pw,v('remember'));return}
    case 'recover':{const pw=f.elements.pw.value,pw2=f.elements.pw2.value;
      if(pw!==pw2)return formErr(f,'The two passwords differ.');if(pw.length<PW_MIN)return formErr(f,`Use at least ${PW_MIN} characters for the password.`);
      doRecover(v('token'),pw,v('remember'));return}
    case 'newtoken':doNewToken(v('token'));return;
    case 'set-pw':{const pw=f.elements.pw.value,pw2=f.elements.pw2.value;T.msgK='pw';T.pwMsg='';T.pwErr='';
      if(pw!==pw2){T.pwErr='The two passwords differ.';render();return}
      if(pw.length<PW_MIN){T.pwErr=`Use at least ${PW_MIN} characters.`;render();return}
      T.busy='pw';render();rewrapPassword(pw,GH.cfg.token,'planner: change the sign-in password').then(()=>{T.busy='';T.pwMsg='Saved. Other devices can use it in about a minute.';render()}).catch(err=>{T.busy='';T.pwErr='Could not save: '+err.message;render()});return}
    case 'swap-token':{const token=v('token'),pw=f.elements.pw.value;T.msgK='tk';T.pwMsg='';T.pwErr='';T.busy='tk';render();
      (async()=>{const old=GH.cfg.token;GH.cfg.token=token;
        try{await GH.repo();const cur=await readVaultApi();await unwrap(wrapOf(cur.v,'password'),pw)}
        catch(e){GH.cfg.token=old;throw new Error(e.name==='OperationError'?'the current password is not right':e.status===401?'GitHub rejected the new token':e.message)}
        const s=sec.get(CFG_KEY);s.token=token;sec.set(CFG_KEY,s);await rewrapPassword(pw,token,'planner: new token')})()
        .then(()=>{T.busy='';T.pwMsg='Token replaced. You can delete the old one on GitHub.';render()}).catch(err=>{T.busy='';T.pwErr='Could not replace it: '+err.message;render()});return}
    case 'todo-edit':saveTodoEdit(f.elements.t);return;
    case 'todo-add':{const item=f.dataset.item;if(!v('t'))return;addTodo(item,v('t'),v('d'),'');U.exp[item]=true;commit('new to-do');refocus('add-t-'+item);return}
    case 'log-add':{if(!v('t'))return;addLog(f.dataset.item,v('t'),{d:v('d')||TODAY_ISO});U.exp['log:'+f.dataset.item]=true;commit('progress log');refocus('log-t-'+f.dataset.item);return}
    case 'item-add':{const area=f.dataset.area,k=f.dataset.kind;const it={id:k==='proj'?nextProjId():'n'+uid(),area,kind:k,set:KIND_SET[k],title:v('title'),created:TODAY_ISO};
      it.st=SETS[it.set][0];if(k==='proj'){it.target=v('sub');it.people='';it.notes=''}else it.sub=v('sub');
      if(area==='research')it.sel=true;
      D.items.push(it);T.adding='';U.exp[it.id]=true;saveUI();commit('new item');requestAnimationFrame(()=>{const el=document.getElementById('it-'+it.id);if(el)flash(el)});return}
    case 'item-edit':{const it=itemById(f.dataset.id);if(!it)return;it.title=v('title')||it.title;
      if(it.kind==='proj'){it.target=v('target');it.people=f.elements.people.value.trim();it.notes=f.elements.notes.value.replace(/\s+$/,'')}else it.sub=f.elements.sub.value.replace(/\s+$/,'');
      T.editItem='';commit('edit item');return}
    case 'blk':{const id=f.dataset.id;const b=D.blocks[id]=Object.assign({type:'list'},D.blocks[id]||{});b.title=v('title');b.text=f.elements.text.value.replace(/\s+$/,'');T.editBlock='';U.exp['blk:'+id]=true;commit('edit: '+(b.title||id));return}
    case 'deadlines':{let bad=0;const keep=new Set();
      for(const line of f.elements.text.value.split('\n').map(x=>x.trim()).filter(Boolean)){const m=/^(\d{4}-\d{2}-\d{2})\s+(.+)$/.exec(line);if(!m||!parseD(m[1])){bad++;continue}
        let x=D.milestones.find(y=>y.t===m[2].trim());if(!x){x={id:'m'+uid(),t:m[2].trim(),d:m[1],kind:'venue',est:false,url:'',note:'',done:false};D.milestones.push(x)}
        x.d=m[1];x.pin=true;keep.add(x.id)}
      for(const x of D.milestones)if(x.pin&&!keep.has(x.id))x.pin=false;
      T.editDl=false;commit('deadlines');if(bad)toast(bad+(bad===1?' line was':' lines were')+' skipped: start each with a date like 2026-12-04');return}
    case 'servers':{const old=D.servers||[];const out=[];let bad=0;
      for(const raw of f.elements.text.value.split('\n')){const line=raw.trim();if(!line)continue;const cut=line.indexOf(' #');
        const main=(cut<0?line:line.slice(0,cut)).trim(),note=cut<0?'':line.slice(cut+2).trim();const [name,url]=main.split(/\s+/);
        if(!name||!/^https?:\/\/[^\s]+$/.test(url||'')){bad++;continue}
        const prev=old.find(s=>s.name===name);out.push({id:prev?prev.id:'s'+uid(),name,url,note})}
      D.servers=out;T.editSrv=false;LIVE.hist={};LIVE.st={};commit('servers');if(bad)toast(bad+(bad===1?' line was':' lines were')+' skipped: each needs a name and an http(s) address');return}
    case 'student-new':{if(!v('name'))return;(D.students=D.students||[]).push({id:'st'+uid(),name:v('name'),projects:[],note:''});T.addingStudent=false;commit('students');return}
    case 'student':{const s=(D.students||[]).find(x=>x.id===f.dataset.id);if(!s)return;s.name=v('name')||s.name;s.note=v('note');T.editStudent='';commit('students');return}
  }
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT'||b.tagName==='INPUT')return;
  const act=b.dataset.act,id=b.dataset.id,v=b.dataset.v;

    case 'sel':{const it=itemById(id);if(!it)return;it.sel=!it.sel;commit(it.sel?'select':'unselect');return}

    case 'hide':snapshot();D.hidden=D.hidden||{};D.hidden[id]=v||id;commit('delete section');toast('Deleted. You can restore it in Settings.',true);return;

    case 'add-open':T.adding=v;render();{const n=document.getElementById('na-title-'+v.replace(/\|/g,'-'));if(n)n.focus()}return;
    case 'add-cancel':T.adding='';render();return;
    case 'more':{const row=b.closest('.td');if(row)row.classList.toggle('show-act');return}
    case 'todo-del':snapshot();deleteTodo(id);commit('delete to-do');toast('To-do deleted',true);return;
    case 'log-del':snapshot();D.logs=D.logs.filter(l=>l.id!==id);commit('delete log entry');toast('Entry deleted',true);return;
    case 'blk-edit':T.editBlock=id;render();{const n=document.getElementById('blk-text-'+id);if(n)n.focus()}return;

function saveTodoEdit(inp){T.editTodo='';const val=inp.value.trim();
  if(inp.dataset.edit==='wkly'){const it=itemById(inp.dataset.item);const w=it&&(it.weekly||[]).find(x=>x.id===inp.dataset.id);if(w&&val&&val!==w.t){w.t=val;commit('edit weekly task')}else render();return}
  const td=todoById(inp.dataset.id);if(td&&val&&val!==td.t){td.t=val;commit('edit to-do')}else render()}

const BUILD=(document.querySelector('meta[name="app-build"]')||{}).content||'dev';
let lastCheck=0;
async function checkUpdate(){
  if(!/^https?:/.test(location.protocol)||Date.now()-lastCheck<60000)return;lastCheck=Date.now();
  try{const r=await fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const m=/<meta name="app-build" content="([^"]+)"/.exec(await r.text());
    if(m&&m[1]!==BUILD&&BUILD!=='dev'&&!/^__/.test(BUILD)){const bar=document.getElementById('update');bar.dataset.v=m[1];bar.hidden=false}
  }catch(e){}
}

const q=document.getElementById('q'),res=document.getElementById('results');let hits=[];
const PANELNAME=Object.assign({settings:'Settings'},TABNAME);
function textOf(el){let s='';const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('select,button.x,.due,input,.wkb,.ichip')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});while(w.nextNode())s+=w.currentNode.nodeValue+' ';return s.replace(/\s+/g,' ').trim()}
function doSearch(){
  const term=q.value.trim().toLowerCase();if(!term||!D){res.hidden=true;return}
  renderAllPanels();hits=[];
  for(const el of document.querySelectorAll('#panels [data-find]')){const txt=textOf(el);const i=txt.toLowerCase().indexOf(term);if(i<0)continue;
    hits.push({el,txt,i,tab:el.closest('[data-panel]').dataset.panel});if(hits.length>=50)break}
  res.innerHTML=hits.length?hits.map((h,k)=>{const a=Math.max(0,h.i-36),b=Math.min(h.txt.length,h.i+term.length+60);
    return `<button type="button" data-hit="${k}"><span class="rt">${PANELNAME[h.tab]}</span>${a>0?'…':''}${esc(h.txt.slice(a,h.i))}<mark>${esc(h.txt.slice(h.i,h.i+term.length))}</mark>${esc(h.txt.slice(h.i+term.length,b))}${b<h.txt.length?'…':''}</button>`}).join('')
    :`<div class="empty">Nothing found for “${esc(q.value.trim())}”.</div>`;
  res.hidden=false}
q.addEventListener('input',doSearch);
q.addEventListener('focus',()=>{if(q.value.trim())doSearch()});
q.addEventListener('keydown',e=>{if(e.key==='Escape'){q.value='';res.hidden=true;q.blur()}if(e.key==='Enter'){const f=res.querySelector('button');if(f)f.click()}});
res.addEventListener('click',e=>{const b=e.target.closest('[data-hit]');if(!b)return;const h=hits[+b.dataset.hit];res.hidden=true;if(!h)return;
  U.tab=h.tab;saveUI();try{history.replaceState(null,'','#'+h.tab)}catch(e){}renderTabs();for(const id of PANEL_IDS)document.getElementById('p-'+id).hidden=id!==h.tab;
  reveal(h.el);requestAnimationFrame(()=>flash(h.el))});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))res.hidden=true});

/* ============================== boot ============================== */
async function boot(){
  const h=(location.hash||'').slice(1);if(PANELS[h])U.tab=h;if(!PANELS[U.tab])U.tab='research';
  applyTheme();paintHead();
  const cfg=sec.get(CFG_KEY);const seedEl=document.getElementById('seed');
  if(cfg&&cfg.token&&cfg.dek){
    GH.cfg=Object.assign(defaultCfg(),cfg);Sync.mode='github';await useDek(cfg.dek);fetchVault().then(v=>{if(v)T.vault=v});
    const cache=sec.get(CACHE_KEY);
    if(cache&&cache.D&&cache.key===cfgKey(GH.cfg)){D=normalize(cache.D);Sync.base=cache.base;Sync.sha=cache.sha;Sync.pending=!!cache.dirty;Sync.status=Sync.pending?'dirty':'ok';reindex();paintSync();render()}
    else{const host=document.getElementById('panels');host.dataset.ready='';host.innerHTML='<p class="blank">Reading and decrypting your plans…</p>'}
    try{const remote=await GH.get();
      if(remote.missing){if(!D)return screen('missing');Sync.sha=null;Sync.base={};Sync.pending=true;Sync.push();return}
      D=adopt(D&&Sync.pending?merge3(Sync.base,D,remote.data):remote.data);
      Sync.base=remote.plain?{}:remote.data;Sync.sha=remote.sha;Sync.lastAt=nowHM();if(remote.plain)Sync.pending=true;Sync.status=Sync.pending?'dirty':'ok';Sync.cache();reindex();paintSync();render();
      if(Sync.pending)Sync.push();
      loadProjects(true);
    }catch(e){
      if(D){Sync.status=(e.status===401||e.status===403)?'auth':'offline';Sync.msg=e.message;paintSync()}
      else{const auth=e.status===401;if(auth){sec.del(CFG_KEY);GH.cfg=null;Sync.mode='none'}T.vault=await fetchVault();
        T.connectErr=auth?'GitHub refused the saved access. Sign in again.':'Could not read the plans: '+e.message;screen(T.vault?'login':'setup')}
    }
  }else if(seedEl){
    Sync.mode='preview';D=normalize(ls.get(PREVIEW_KEY)||JSON.parse(seedEl.textContent));Sync.status='local';reindex();paintSync();render();
  }else{if(cfg)sec.del(CFG_KEY);T.vault=await fetchVault();screen(T.vault?'login':'setup')}
}
boot().then(()=>setTimeout(checkUpdate,1500));
})();
</script>
</body>

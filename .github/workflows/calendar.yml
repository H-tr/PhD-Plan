# Every 15 minutes: fetch the calendars in the CALENDAR_SOURCES secret, encrypt them for the Control Panel, and
# replace the single commit on the `calendar` branch. Odd minutes, because GitHub delays jobs scheduled on the hour.
name: calendar
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: calendar
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          CALENDAR_SOURCES: ${{ secrets.CALENDAR_SOURCES }}
        run: |
          if [ -n "$CALENDAR_SOURCES" ] && [ -f tools/calendar-sync/public-key.json ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing to sync yet: turn calendar sync on in the panel's settings and add the CALENDAR_SOURCES secret."
          fi
      - if: steps.check.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: steps.check.outputs.go == 'true'
        run: pip install --quiet --disable-pip-version-check icalendar==7.3.0 recurring-ical-events==3.8.2 cryptography==50.0.2 caldav==3.6.0
      - name: Fetch and encrypt
        if: steps.check.outputs.go == 'true'
        env:
          CALENDAR_SOURCES: ${{ secrets.CALENDAR_SOURCES }}
        run: mkdir -p out && python tools/calendar-sync/sync.py out/calendar.json tools/calendar-sync/public-key.json
      - name: Publish to the calendar branch
        if: steps.check.outputs.go == 'true'
        env:
          TOKEN: ${{ github.token }}
        run: |
          [ -f out/calendar.json ] || exit 0
          cd out
          git init -q -b calendar
          git add calendar.json
          git -c user.name=calendar-sync -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -q -m "calendar: update"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" calendar

# Reads each project's to-do file and recent merged pull requests, encrypts them for the panel, and
# force-pushes the result as the single commit of the "projects" branch. See tools/project-sync/README.md.
name: projects

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/project-sync/**']

permissions:
  contents: write

concurrency:
  group: projects
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: tools/project-sync
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read and encrypt
        env:
          PROJECT_REPOS: ${{ secrets.PROJECT_REPOS }}
          PROJECT_TOKENS: ${{ secrets.PROJECT_TOKENS }}
        run: node tools/project-sync/sync.mjs "$RUNNER_TEMP/projects.json" tools/project-sync/panel-key.json
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$RUNNER_TEMP/projects.json" ] || exit 0
          cd "$RUNNER_TEMP" && mkdir out && mv projects.json out/ && cd out
          git init -q && git add projects.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm 'projects: update'
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/projects
